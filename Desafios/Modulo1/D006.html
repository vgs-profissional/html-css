<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>

<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir.Passe o mouse sobre os termos
        para descobrir qual tag deverá utilizar cada caso.
    </p>
    <ul>
        <li><abbr title="Usando a tag &lt;p&gt;">Parágrafo</abbr></li>
        <li><abbr title="Usando as tags &lt;h1&gt; até &lt;h6&gt;">Títulos</abbr></li>
        <li><abbr title="Usando a tag &lt;img&gt;">Imagens</abbr></li>
        <li><abbr title="Usando a tag &lt;abbr&gt;">Abreviações</abbr></li>
        <li><abbr title="Usando a tag &lt;code&gt;">Códigos-fonte</abbr></li>
        <li><abbr title="Usando a tag &lt;ol&gt;">Listas ordenadas</abbr></li>
        <li><abbr title="Usando a tag &lt;ul&gt;">Lista com demarcadores</abbr></li>
        <li><abbr title="Usando a tag &lt;blockquote&gt;">Citações</abbr></li>
    </ul>
</body>

</html>
