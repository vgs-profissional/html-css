<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronauta</title>
    <style>
        body {
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            /*Overflow hidden tira o direito de rolar a página, meio roubo*/
            background-image: url(Imagens-D011/espaco.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: black;
        }

        .caixaImagem {
            position: absolute;
            left: 50%;
            top: 50%;
        }

        img {
            position: relative;
            transform: translate(-50%, -50%);

        }
    </style>
</head>

<body>
    <div class="caixaImagem">
        <img src="Imagens-D011/astronauta.png" alt="Astronauta">
    </div>
</body>

</html>
