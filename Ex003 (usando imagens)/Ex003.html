<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usando imagens</title>
    <style>
        body{
            text-align: center;
            background-color: beige;
        }
    </style>
</head>
<body>
    <h1>Testando carga de imagens</h1>
    <p>Abaixo você vai ver uma imagem que está na mesma pasta:</p>
    <img src="logo-html-200.png" alt="Logo HTML 5">
    <!--Mesma pasta-->
    <p>Podemos também carregar imagens em sub-pastas</p>
    <img src="imagens/logos/logo-css-200.png" alt="logo css3">
    <!--Sub-pasta-->
    <p>Também podemos carregar imagens externas</p>
    <img src="https://static.vecteezy.com/system/resources/thumbnails/027/127/560/small/javascript-logo-javascript-icon-transparent-free-png.png" alt="Logo Javascript">
    <!--URL-->
</body>
</html>
