<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>

<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e dminua o tamanho do seu
        navegador</p>
    <picture>
        <!--Não inverter pq para de funcionar-->
        <source media="(max-width: 750px)" srcset="Imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="Imagens/foto-m.png" type="image/png">
        <img src="Imagens/foto-g.png" alt="imagem flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áduio em HTML5</p>
    <audio src="midia/is-this-a-racist-cartoon.mp3" controls></audio> <!--Controls pra aparecer os controles de audio, loop pra loopar, autoplay pra autoplayar-->
    <audio preload="metadata" controls>
        <source src="midia/é-a-união-flasco-feat-lucas-hype-clipe-oficial.mp3" type="audio/mpeg">
        <source src="midia/é-a-união-flasco-feat-lucas-hype-clipe-oficial.ogg" type="audio/ogg">
        <source src="midia/é-a-união-flasco-feat-lucas-hype-clipe-oficial.wav" type="audio/wav">
        <p>Não foi possível carregar o arquivo de áudio <a
                href="midia/é-a-união-flasco-feat-lucas-hype-clipe-oficial.mp3"> clique aqui para baixar o arquivo
                MP3</a></p>
    </audio>
</body>

</html>
