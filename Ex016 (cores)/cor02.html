<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em css</title>
    <style>
        * {/* = Configurações globais*/
            
            height: 100%;
        }

        body {
            background-image: linear-gradient(45deg, #7D0CFF 10%, #FF00E6, #FF2727, #FFC400, #FF007D);
            background-attachment: fixed;
        }
    </style>
</head>

<body>
    <h1>Testando gradientes</h1>
</body>

</html>
