<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        /*Usando fontes baixadas: da pra adicionar arquivos .ftt ou .fot pra usar além das fontes web-safe.
        Crie a regra com @, dá um nome, aponta para o arquivo seja feliz. 
        Dá pra definir se é bold aqui mesmo pra economizar linha também. */
        @font-face {
            font-family: "love larry";
            src: url(fonts/love_larry/love\ larry\ ttf.ttf);
            font-weight: normal;
            font-style: normal;

        }

        @font-face {
            font-family: "lovely";
            src: url(fonts/lovely_valentine_script/Lovely\ Valentine\ Sans.otf);
            font-weight: normal;
            font-style: normal;
        }

        /*Tipos de format()
                -opentype (otf)
                -truetype (ttf)
                -embedded-opentype
                -truetype-aat (Apple Advanced Typography) 
            */

        body {
            font-family: "lovely", sans-serif;
            font-weight: normal;
        }

        h1 {
            font-family: "love larry", sans-serif;
            font-weight: normal;
            font-size: 3em;
        }
    </style>
</head>

<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas iste neque nam perferendis, aut expedita ut
        doloribus! Officia, rem, eum perferendis id in deleniti molestias earum fugit ipsam cupiditate vero.</p>
    <a href="fonte01.html">Página 1</a>
</body>

</html>
