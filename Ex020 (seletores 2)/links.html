<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /* Seletores personalizados
            # = id
            . = class
            : = pseudo-classe 
           :: = pseudo-elemento 
            > = children
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: rgb(255, 0, 0);
            text-decoration: none;
        }

        /* Estado caso o link já foi visitado antes */
        a:visited {
            color: rgb(195, 10, 10);
        }


        /* Estado quando passa o mouse em cima */
        a:hover {
            text-decoration: underline;
            color: rgb(40, 141, 218);
        }

        /* Estado ativo, clicou */
        a:active {
            color: yellow;
        }

        .especial:hover {
            color: rgb(255, 0, 230);
            background-color: rgb(85, 0, 255);
        }

        
        .especial::before {
            content: ' ⇒';
        }

        /* pseudo-elemento que adiciona algo depois do texto */
        .especial::after {
            content: ' [link]';
            text-decoration: none;
            color: darkgray;
        }
        /* Isso funciona */
        .especial:hover::after /*,.especial:hover::before*/ {
            content: ' [link]';
            text-decoration: none;
            color: black;
        }

    </style>
</head>

<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://github.com/gustavoguanabara/html-css/tree/master/aulas-pdf">Repositório GitHub</a></li>
        <li><a href="https://www.youtube.com/c/CursoemVídeo" class="especial">Canal do Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com/apoie">Site do CursoEmVídeo</a></li>
    </ul>
</body>

</html>
