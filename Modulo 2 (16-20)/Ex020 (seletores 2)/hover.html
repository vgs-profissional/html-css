<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Seletor para selecionar uma tag dentro de outra tag (p dentro de div) */
        div>p {
            display: none;
        }

        /*Pseudo-classe e  child */
        div:hover>p {
            display: block;
            color: rgb(162, 22, 22);
            background-color: rgb(245, 125, 81);
            width: 10%;
        }

        /* Seletor para estado de uma tag (hover para ação de passar o mouse em cima) */
        div:hover {
            color: rgb(232, 111, 111);
        }
    </style>
</head>

<body>
    <h1>Exemplo de Hover</h1>
    <p>Passe o mouse sobreo texto abaixo</p>
    <div>
        Passe o mouse aqui
        <p>Texto escondido...</p>
    </div>
    <p>Fim do exemplo</p>
    <a href="links.html">Página 2</a>
    <a href="pseudo-classe.html">Página 3</a>
</body>

</html>
